
name: Orman Barkod APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Android derleme araçlarını kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            python3-pip autoconf automake libtool \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Python paketlerini kur
        run: |
          python3 -m pip install --user --upgrade pip
          python3 -m pip install --user buildozer cython==0.29.36

      - name: Android APK oluştur
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          buildozer -v android debug

      - name: APK dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: Orman-Barkod-APK
          path: bin/*.apk
          if-no-files-found: error
