
name: Orman Barkod APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Projeyi indir
        uses: actions/checkout@v4

      - name: Java ve Android araçlarını kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gerekli sistem paketlerini kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev \
            cmake build-essential ccache

      - name: Python ortamını hazırla
        run: |
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install "Cython==0.29.36" "buildozer==1.5.0"

      - name: Android SDK lisanslarını kabul et
        run: |
          mkdir -p "$HOME/.buildozer"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: APK oluştur
        run: |
          buildozer -v android debug

      - name: APK dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: Orman-Barkod-APK
          path: bin/*.apk
          if-no-files-found: error
